; DataHelix solo recipe — process supervision (proposal decision 1.5).
; Two processes, one container: the data plane and the web front. Each
; restarts independently; both log to the container's stdout/stderr with a
; program prefix. (The Modeler's git relay was the third — removed by
; platform ADR-0005.)

[program:mosaic]
command=%(ENV_MOSAIC_BIN)s serve --graphql --config %(ENV_MOSAIC_CONFIG)s --host 127.0.0.1 --port 8001
directory=/project
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
