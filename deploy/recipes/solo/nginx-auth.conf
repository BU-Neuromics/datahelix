# DataHelix solo recipe — authenticated front (platform ADR-0006).
#
# Selected by the entrypoint when AUTH_MODE != none; nginx.conf is the
# unauthenticated original. Every route is gated by `auth_request` against
# oauth2-proxy on 127.0.0.1:4180, which holds the session in an httpOnly
# cookie. No token ever reaches the browser.
#
# The proxy's port is NOT published — only this server block is. Mosaic's REST
# port 8001 is outside this boundary by construction (it is unproxied); a
# deployment enabling auth must keep it closed.

server {
    listen 8080;
    server_name _;
    root /srv/aperture;
    index index.html;

    # Emit RELATIVE Location headers. With the default (on), nginx builds
    # redirects from $host:$server_port — i.e. the CONTAINER's port 8080 — so
    # any port-mapped or load-balanced deployment sends users to a port that
    # is not reachable from where they are.
    absolute_redirect off;

    # ── The auth endpoints themselves must never require auth ──────────────
    # `auth_request` below is a SERVER-level directive: it applies to every
    # location regardless of where it appears in this file. Without turning it
    # off here the sign-in page would itself require a session — a redirect
    # loop in which no one can ever sign in.
    location /oauth2/ {
        auth_request off;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    # The internal subrequest: 202 when the session is good, 401 when not.
    location = /oauth2/auth {
        internal;
        auth_request off;  # never gate the gate — see above
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An auth subrequest carries no body and needs no content headers.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Redirect (302), never 403: browsers do not follow redirects on a 403,
    # which breaks the sign-in flow. `rd` brings the user back where they were.
    location @oauth2_signin {
        auth_request off;
        return 302 /oauth2/start?rd=$scheme://$http_host$request_uri;
    }

    # ── Everything below is gated ──────────────────────────────────────────
    auth_request /oauth2/auth;
    error_page 401 = @oauth2_signin;

    # Lifted from the auth subrequest response for downstream use.
    auth_request_set $auth_user   $upstream_http_x_auth_request_user;
    auth_request_set $auth_email  $upstream_http_x_auth_request_email;
    auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

    # Liveness must answer for the container healthcheck and any load
    # balancer, neither of which carries a session.
    location = /health {
        auth_request off;
        proxy_pass http://127.0.0.1:8001/health;
    }

    # Never cache the runtime config or the HTML shell; hashed assets are
    # immutable. (Mirrors the Aperture image's own config, ADR-0034.)
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Removed by platform ADR-0005.
    location /modeler/ {
        return 410 "The LinkML Modeler is no longer bundled (platform ADR-0005). Run it separately against your schemas/ directory.\n";
        default_type text/plain;
    }

    # ── Data plane ─────────────────────────────────────────────────────────
    # X-Hippo-Actor is the contract mosaic.core.middleware already parses
    # ("actor:<id>"), so provenance names the real user instead of the
    # `Bearer solo` placeholder. proxy_set_header OVERRIDES anything the
    # client sent, which is what makes the header trustworthy — and is why
    # this proxy must be the only path to Mosaic (platform ADR-0006).
    location /graphql {
        proxy_pass http://127.0.0.1:8001/graphql;
        proxy_set_header Authorization "Bearer solo";
        proxy_set_header X-Hippo-Actor "actor:$auth_user";
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8001/docs;
        proxy_set_header Authorization "Bearer solo";
        proxy_set_header X-Hippo-Actor "actor:$auth_user";
    }
    location = /redoc {
        proxy_pass http://127.0.0.1:8001/redoc;
        proxy_set_header Authorization "Bearer solo";
        proxy_set_header X-Hippo-Actor "actor:$auth_user";
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8001/openapi.json;
        proxy_set_header Authorization "Bearer solo";
        proxy_set_header X-Hippo-Actor "actor:$auth_user";
    }

    # SPA fallback: Aperture's client-side state lives in query params.
    location / {
        try_files $uri /index.html;
    }
}
