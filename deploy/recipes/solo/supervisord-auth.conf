; DataHelix solo recipe — the authenticating proxy (platform ADR-0006).
;
; Copied into /etc/supervisor/conf.d/ by the entrypoint ONLY when
; AUTH_MODE != none, so an unauthenticated deployment never starts it.
; Args are read from a file the entrypoint generates, which avoids a second
; round of shell quoting through supervisord's exec.
;
; Bound to 127.0.0.1 — the proxy's port is never published; nginx is the only
; exposed surface.

[program:oauth2-proxy]
command=/bin/sh -c "exec xargs -a /run/datahelix/proxy.args -d '\n' /usr/local/bin/oauth2-proxy"
autorestart=true
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
