# DataHelix demo-reel recipe — `demo`'s same-origin front, plus two things the
# conversational panel needs.
server {
    listen 8080;
    server_name _;
    root /srv/aperture;
    index index.html;

    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same-origin data plane; nginx injects the placeholder bearer token the
    # guard requires. A converseQuerySpec turn holds this request open for the
    # whole model call — nginx's 60s default would cut a slow turn off with a
    # 504 before Mosaic's own planner timeout (MOSAIC_EXON_TIMEOUT, 120s in
    # docker-compose.yml) could answer with a proper 'error' turn. Keep this
    # above that.
    location /graphql {
        proxy_pass http://127.0.0.1:8001/graphql;
        proxy_set_header Authorization "Bearer demo";
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
    }
    location = /docs {
        proxy_pass http://127.0.0.1:8001/docs;
        proxy_set_header Authorization "Bearer demo";
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8001/openapi.json;
        proxy_set_header Authorization "Bearer demo";
    }

    location / {
        try_files $uri /index.html;
    }
}

# MCP for the planner container, and nothing else. Never published by
# docker-compose.yml — reachable only on the compose network.
#
# Host is rewritten to loopback: Mosaic's MCP transport accepts only loopback
# Host headers unless MOSAIC_MCP_ALLOWED_HOSTS widens it (mosaic#214). Proxying
# keeps that DNS-rebinding guard at its default, keeps Mosaic itself bound to
# 127.0.0.1, and means the planner can reach /mcp but not REST or GraphQL.
server {
    listen 8100;
    server_name _;

    location /mcp {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host 127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
    }
    location / {
        return 404;
    }
}
