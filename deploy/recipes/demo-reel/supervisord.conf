; DataHelix demo-reel recipe — process supervision. As `demo`, plus `--mcp`:
; the planner container reads the capability manifest over MCP. Mosaic stays on
; loopback; nginx's internal :8100 listener is the only way in from the planner.
;
; MOSAIC_EXON_URL / MOSAIC_EXON_TIMEOUT arrive from docker-compose.yml and are
; inherited from supervisord's environment. With MOSAIC_EXON_URL set Mosaic
; registers `converseQuerySpec`, which is what makes Aperture show its chat
; panel; unset, the stack is plain `demo`.

[program:mosaic]
command=%(ENV_MOSAIC_BIN)s serve --graphql --mcp --config %(ENV_MOSAIC_CONFIG)s --host 127.0.0.1 --port 8001
directory=/project
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
