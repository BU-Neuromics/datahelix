# DataHelix certification — seed data bundle (fixture v1.1.0)
#
# Tree-root bundle format (hippo ingest --file): top-level keys are pluralized
# class-name accessors; values are lists of instance dicts; identity is by `id`
# (re-ingesting an existing id updates it in place, so seeding is idempotent).
#
#   hippo ingest --file seed.yaml \
#     --validate-schema schema/   # validates against portal_schema + control plane
#
# Reference slots (`author`, `book`) carry the referenced instance's `id`.
# `co_authors` (multivalued, stored) carries a list of Author ids — a real
# to-many forward reference (Aperture ADR-0041 explode target). `Author.books`
# is NOT seeded here: it is a virtual reverse edge derived from `Book.author`
# (mosaic ADR-0011) and would be rejected as a write to a read-only field.
#
# Kept small on purpose: enough rows to make browse/filter facets meaningful
# and to leave a clean slate for the write / atomic-workflow loops (which create
# their own entities). The control-plane collection (ApertureDocument) is seeded
# EMPTY — the SPA creates its own saved-views/drafts during the scenario.

authors:
  - id: author-austen
    is_available: true
    name: Jane Austen
    bio: English novelist known for social realism and wit.
  - id: author-leguin
    is_available: true
    name: Ursula K. Le Guin
    bio: American author of speculative fiction.
  - id: author-tolkien
    is_available: true
    name: J. R. R. Tolkien
    bio: English writer and philologist.

books:
  - id: book-pride
    is_available: true
    title: Pride and Prejudice
    author: author-austen
    format: hardcover
    in_print: true
    year: 1813
  - id: book-emma
    is_available: true
    title: Emma
    author: author-austen
    format: paperback
    in_print: true
    year: 1815
  - id: book-left-hand
    is_available: true
    title: The Left Hand of Darkness
    author: author-leguin
    format: paperback
    in_print: true
    year: 1969
  - id: book-dispossessed
    is_available: true
    title: The Dispossessed
    author: author-leguin
    format: ebook
    in_print: false
    year: 1974
  - id: book-hobbit
    is_available: true
    title: The Hobbit
    author: author-tolkien
    format: audiobook
    in_print: true
    year: 1937
    co_authors: [author-austen, author-leguin]
    # co_authors gives explode two members from one anchor (a declared grain
    # change, 128→342-style) sitting alongside the unexploded `author`
    # to-one column on the same row set — both halves of Aperture ADR-0041's
    # forward traversal in one seeded row. Row count is unchanged (5 Books),
    # so 01-browse-filter.spec.ts's count assertion still holds.

reviews:
  - id: review-pride-1
    is_available: true
    book: book-pride
    rating: 5
    body: A timeless classic.
  - id: review-left-hand-1
    is_available: true
    book: book-left-hand
    rating: 4
    body: A landmark of the genre.
